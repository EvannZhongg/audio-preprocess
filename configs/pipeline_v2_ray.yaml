# pipeline_v2_ray hardware map.
#
# ONE file describes every GPU type in the cluster. Each Ray actor detects its
# own GPU at startup (torch.cuda.get_device_name) and picks the profile whose
# `match` is a substring of that name, then runs that profile's pipeline config.
#
# So a single config + a single code path drives a mixed V100/P40/A10 cluster.
#
# The head node parses every profile's pipeline_config JSON into PipelineParams
# and ships them inside the (small) config object to each actor -- worker nodes
# need neither this yaml nor the config_for_*.json files, only the model ckpts.
#
# How many pipeline actors run on each machine is decided PER-MACHINE at
# `ray start` time, not here, via a custom `pipe_slot` resource:
#
#   # strong box: run 3 concurrent pipelines sharing its GPU
#   ray start --address=<head> --resources='{"pipe_slot": 3}'
#   # weak box: just 1
#   ray start --address=<head> --resources='{"pipe_slot": 1}'
#
# The driver spawns one actor per declared pipe_slot cluster-wide. Each actor
# reserves only a tiny GPU fraction (enough to get CUDA_VISIBLE_DEVICES set);
# pipe_slot is the concurrency gate across machines. Within one actor,
# max_concurrency files run at once on separate threads: their decode (ffmpeg)
# and export (mp3/JuiceFS) overlap freely while a single per-actor lock keeps
# exactly one file on the GPU. This overlaps IO with compute to keep the GPU
# busy, so >1 pipe_slot per card is only needed if a single GPU has spare
# capacity beyond what one actor's max_concurrency can fill.

defaults:
  max_files_per_actor: 10000      # recycle actor after N files (memory safety valve)
  max_age_seconds: 36000         # or after M seconds alive, whichever comes first
  max_concurrency: 3            # files in flight per actor (Ray max_concurrency); decode+export
                                # of these overlap while the GPU stays serialized by a lock

hardware:
  v100:
    match: "V100"               # matched against torch.cuda.get_device_name(0)
    pipeline_config: configs/config_for_v100_for_ko.json

  p40:
    match: "P40"
    pipeline_config: configs/config_for_p40.json

  # A100 (~2.5x V100 FP16 tensor throughput, ~1.7-2.3x HBM bandwidth depending on
  # 40GB/80GB SKU) -- batch sizes below are scaled up ~1.5-2x from config_for_v100.json
  # accordingly; tune down if you see OOM on the 40GB SKU.
  # NOTE: must be listed (and thus matched) BEFORE "a10" below, since match_profile()
  # does a substring test and "a10" is itself a substring of "a100" -- reversing the
  # order would make every A100 GPU incorrectly match the a10 profile.
  a100:
    match: "A100"
    pipeline_config: configs/config_for_a100.json

  a10:
    match: "A10"
    pipeline_config: configs/config_for_a10.json
